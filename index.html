<style>
:root{
  --bg:#F5F2FB; --card:#fff; --ink:#261E3C; --ink2:#6A6283; --ink3:#9A93B0;
  --pri:#6B4ECF; --pri2:#8A70E6; --prid:#45299E; --soft:#EEE8FB; --soft2:#F7F4FD; --line:#E7E1F4;
  --ok:#2E9E68; --okb:#E5F5EC; --warn:#D9781F; --warnb:#FDF0E2; --bad:#D14C4C; --badb:#FCE9E9;
  --gold:#F2C46B; --night:#120D24; --night2:#1E1638;
  --r:20px; --rs:14px; --sh:0 6px 24px rgba(60,35,140,.08); --sh2:0 10px 34px rgba(60,35,140,.16);
  --navh:74px; --safe:env(safe-area-inset-bottom,0px);
  --f:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button,a,input,select,textarea,summary{touch-action:manipulation}
button,.nav,.quick,.step,.som{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{--top:env(safe-area-inset-top,0px)}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex:none}
.press{transition:transform .12s ease,opacity .12s}
.press:active{transform:scale(.97);opacity:.9}
.hide{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:calc(var(--navh) + var(--safe) + 24px)}
#app.noNav{padding-bottom:24px}
body.hasPlayer #app{padding-bottom:calc(var(--navh) + var(--safe) + 100px)}
body.hasPlayer #app.noNav{padding-bottom:100px}
.wrap{padding:0 18px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--top)) 18px 6px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,rgba(245,242,251,0))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(160deg,#7C5CD9,#40258F);display:grid;place-items:center;box-shadow:0 4px 12px rgba(80,50,180,.3)}
.logo svg{width:22px;height:22px}
.topbtn{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh);position:relative;font-size:20px;color:var(--prid)}
.topbtn .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid #fff}

/* cabeçalhos de página */
.hello{padding:6px 18px 4px}
.hello small{color:var(--ink2);font-weight:700;font-size:14px}
.hello h1{font-size:26px;font-weight:900;margin-top:2px;letter-spacing:-.3px}
.hello p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.ptop{padding:8px 18px 4px;display:flex;align-items:flex-start;gap:12px}
.ptop h1{font-size:26px;font-weight:900;letter-spacing:-.3px}
.ptop p{margin:3px 0 0;color:var(--ink2);font-size:15px}
.back{width:40px;height:40px;border-radius:13px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:20px;flex:none;color:var(--prid)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 18px 10px}
.sec h2{font-size:18px;font-weight:900}
.sec span,.sec button{font-size:14px;color:var(--pri);font-weight:800}

/* cartões */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:12px 18px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.b{font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--soft);color:var(--prid);font-weight:800;font-size:13px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--soft);color:var(--prid)}
.pill.ok{background:var(--okb);color:var(--ok)} .pill.warn{background:var(--warnb);color:var(--warn)} .pill.bad{background:var(--badb);color:var(--bad)}

/* botões */
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:16px;background:linear-gradient(180deg,#7A5CE0,#5B3EC2);color:#fff;font-weight:900;font-size:16px;letter-spacing:.2px;box-shadow:0 8px 20px rgba(91,62,194,.35);text-decoration:none;text-align:center}
.cta.green{background:linear-gradient(180deg,#3DBA7C,#26975F);box-shadow:0 8px 20px rgba(38,151,95,.3)}
.cta.ghost{background:var(--soft);color:var(--prid);box-shadow:none}
.cta.white{background:#fff;color:var(--prid);box-shadow:none}
.cta.sm{padding:11px 14px;font-size:14px;border-radius:13px;width:auto}
.cta:disabled{opacity:.45;box-shadow:none}
.link{color:var(--pri);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* hero / ritual */
.hero{margin:12px 18px;border-radius:24px;padding:18px;color:#fff;background:radial-gradient(120% 120% at 100% 0%,#8C6CF0 0%,#5434B8 45%,#2B1A6B 100%);box-shadow:var(--sh2);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,160,.35),rgba(255,226,160,0) 70%)}
.hero h2{font-size:20px;font-weight:900}
.hero .sub{opacity:.85;font-size:14px;margin-top:2px}
.ritual-head{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.ring{width:62px;height:62px;flex:none;position:relative}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900}
.steps{margin-top:14px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.step{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:15px;padding:10px 12px;text-align:left;width:100%}
.step .ck{width:26px;height:26px;border-radius:9px;border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;flex:none;font-size:15px}
.step.on .ck{background:var(--gold);border-color:var(--gold);color:#3A2470}
.step.on .st{opacity:.65;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.5)}
.step .st{font-weight:800;font-size:15px}
.step .ss{font-size:12.5px;opacity:.78;line-height:1.3;margin-top:1px}
.step .go{margin-left:auto;font-size:12px;font-weight:900;background:#fff;color:var(--prid);padding:6px 10px;border-radius:999px;flex:none}
.done-banner{margin-top:14px;background:rgba(255,255,255,.14);border-radius:15px;padding:12px;text-align:center;font-weight:800;position:relative;z-index:1}

/* estoque */
.stock{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin:12px 18px;width:calc(100% - 36px);text-align:left}
.stock.urg{background:linear-gradient(135deg,#FFF6EA,#FFE9D2);border:1.5px solid #F6C58F}
.stock .tx{flex:1;min-width:0}
.stock small{display:block;color:var(--ink2);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.stock b{display:block;font-size:16px;font-weight:900}
.stock span.s{display:block;font-size:13px;color:var(--ink2)}
.bar{height:7px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pri2),var(--pri))}
.urg .bar i{background:linear-gradient(90deg,#F4A04C,#E0732A)}
.stock .go{font-weight:900;font-size:13px;padding:8px 12px;border-radius:999px;background:var(--pri);color:#fff;flex:none}
.urg .go{background:#E0732A}
.minis{display:flex;gap:10px;overflow-x:auto;padding:4px 18px 6px;scrollbar-width:none}
.minis::-webkit-scrollbar{display:none}
.mini{flex:none;width:136px;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px;text-align:left}
.mini b{display:block;font-size:14px;font-weight:900;margin-top:6px;line-height:1.2}
.mini small{display:block;color:var(--ink2);font-size:12.5px}

/* garrafinha */
.btl{display:block;flex:none}

/* janela de sono */
.nap{display:flex;gap:14px;align-items:center}
.nap .big{font-size:28px;font-weight:900;letter-spacing:-.5px}
.nap-ic{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:26px;color:var(--pri);flex:none}

/* registro rápido */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 18px}
.qb{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:12.5px;position:relative}
.qb .qi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px}
.qb.live{outline:2.5px solid var(--pri);outline-offset:-2.5px}
.qb.live:after{content:"";position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.c-mam{background:#FCE8F0;color:#C2477A}.c-sono{background:#ECE6FD;color:#6B4ECF}.c-fra{background:#E4F3FB;color:#2A87B8}.c-col{background:#FFF1DA;color:#C7851A}.c-apl{background:#E6F6EE;color:#2E9E68}

/* resumo */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--soft2);border-radius:15px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat small{color:var(--ink2);font-size:12px;font-weight:700}

/* dica */
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ti{width:42px;height:42px;border-radius:14px;background:#FFF4DA;color:#C98A12;display:grid;place-items:center;font-size:21px;flex:none}
.tip b{display:block;font-size:15.5px}
.tip p{margin:2px 0 0;color:var(--ink2);font-size:14.5px}

/* upsell */
.ups{display:flex;gap:14px;align-items:center;border-radius:var(--r);padding:14px;margin:12px 18px;background:linear-gradient(135deg,#FBF8FF,#F0EAFE);border:1.5px solid #E0D6FA;text-align:left;width:calc(100% - 36px)}
.ups small{color:var(--pri);font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.ups b{display:block;font-size:16px;font-weight:900;margin-top:1px}
.ups p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}

/* diário */
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:12px 18px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:800;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--prid);box-shadow:0 2px 8px rgba(60,35,140,.1)}
.tracker{display:flex;flex-direction:column;gap:12px}
.trk{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin:0 18px}
.trk-h{display:flex;align-items:center;gap:12px}
.trk-h .qi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.trk-h b{font-size:16.5px;font-weight:900;display:block}
.trk-h small{color:var(--ink2);font-size:13px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:30px;letter-spacing:-.5px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns>*{flex:1}
.tb{padding:12px 8px;border-radius:14px;background:var(--soft);color:var(--prid);font-weight:900;font-size:14.5px;text-align:center}
.tb.on{background:var(--pri);color:#fff}
.tb.stop{background:var(--bad);color:#fff}
.tb.alt{background:#FCE8F0;color:#C2477A}
.tl{margin:0 18px}
.tli{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tli:last-child{border-bottom:0}
.tli .qi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.tli b{font-size:15px;display:block}
.tli small{color:var(--ink2);font-size:13px}
.tli time{margin-left:auto;font-weight:800;color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.tli .del{color:var(--ink3);font-size:18px;padding:6px;margin-right:-6px}
.empty{text-align:center;color:var(--ink2);padding:22px 10px;font-size:14.5px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f);font-size:11px;fill:var(--ink2);font-weight:700}
.chart .v{fill:var(--ink);font-weight:900;font-size:11px}

/* acalmar */
.night-cta{display:flex;align-items:center;gap:14px;margin:12px 18px;padding:18px;border-radius:24px;background:radial-gradient(130% 140% at 0% 0%,#2E2160 0%,#17112F 60%,#0D0920 100%);color:#fff;box-shadow:var(--sh2);width:calc(100% - 36px);text-align:left;position:relative;overflow:hidden}
.night-cta .ni{width:56px;height:56px;border-radius:18px;background:rgba(255,226,160,.16);color:var(--gold);display:grid;place-items:center;font-size:30px;flex:none}
.night-cta b{font-size:19px;font-weight:900;display:block}
.night-cta small{opacity:.8;font-size:13.5px}
.sons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 18px}
.som{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:13px;display:flex;flex-direction:column;gap:8px;text-align:left;position:relative;min-height:104px}
.som .si{width:40px;height:40px;border-radius:13px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-size:20px}
.som b{font-size:14.5px;font-weight:900;line-height:1.2}
.som small{font-size:12px;color:var(--ink2);line-height:1.25}
.som.on{background:linear-gradient(160deg,#7A5CE0,#4B2FA8);color:#fff}
.som.on .si{background:rgba(255,255,255,.18);color:#fff}
.som.on small{color:rgba(255,255,255,.8)}
.eq{position:absolute;right:13px;top:16px;display:flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:currentColor;border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.mass{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;margin:10px 18px;width:calc(100% - 36px);text-align:left}
.mass b{display:block;font-size:15.5px;font-weight:900}
.mass small{color:var(--ink2);font-size:13px}
.mass .dur{margin-left:auto;font-size:12.5px;font-weight:900;color:var(--pri);background:var(--soft);padding:5px 9px;border-radius:999px;flex:none}
.sos{display:flex;align-items:center;gap:13px;margin:12px 18px;padding:15px;border-radius:var(--r);background:linear-gradient(135deg,#FFEFF2,#FFE1E7);border:1.5px solid #F7BFCB;width:calc(100% - 36px);text-align:left}
.sos .si{width:46px;height:46px;border-radius:15px;background:#fff;color:#D0466A;display:grid;place-items:center;font-size:24px;flex:none}
.sos b{font-size:16px;font-weight:900;display:block;color:#8F2442}
.sos small{color:#A5475F;font-size:13px}

/* player fixo */
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + var(--safe) + 10px);width:calc(100% - 24px);max-width:456px;background:#1D1536;color:#fff;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:40;box-shadow:0 12px 30px rgba(20,10,50,.35)}
#app.noNav ~ .player{bottom:calc(var(--safe) + 12px)}
.player .pi{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:19px;color:var(--gold);flex:none}
.player b{font-size:14.5px;display:block;line-height:1.2}
.player small{opacity:.75;font-size:12.5px}
.player .pb{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:18px;flex:none}
.tchips{display:flex;gap:8px;flex-wrap:wrap}
.tchip{padding:8px 13px;border-radius:999px;background:var(--soft);font-weight:800;font-size:14px;color:var(--prid)}
.tchip.on{background:var(--pri);color:#fff}
.vol{width:100%;accent-color:var(--pri)}

/* guias */
.method{display:flex;gap:14px;align-items:center;margin:12px 18px;padding:16px;border-radius:var(--r);background:linear-gradient(135deg,#6B4ECF,#3F2793);color:#fff;width:calc(100% - 36px);text-align:left;box-shadow:var(--sh2)}
.method .mi{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;flex:none}
.method small{opacity:.8;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.method b{display:block;font-size:17px;font-weight:900}
.method em{font-style:normal;opacity:.85;font-size:13.5px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 18px}
.gc{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.gc .gi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px}
.gc b{font-size:15.5px;font-weight:900;line-height:1.2}
.gc small{font-size:12.5px;color:var(--ink2);line-height:1.3}
.alert-cta{display:flex;align-items:center;gap:13px;margin:14px 18px;padding:15px;border-radius:var(--r);background:#FDECEC;border:1.5px solid #F3B9B9;color:#8E2121;width:calc(100% - 36px);text-align:left}
.alert-cta .ai{width:44px;height:44px;border-radius:14px;background:#D14C4C;color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.alert-cta b{display:block;font-size:16px;font-weight:900}
.alert-cta small{font-size:13px;color:#A54545}
.art h3{font-size:17px;font-weight:900;margin:20px 0 8px}
.art ul{margin:0;padding:0;list-style:none}
.art li{position:relative;padding:8px 0 8px 26px;font-size:15.5px;border-bottom:1px solid var(--line)}
.art li:last-child{border-bottom:0}
.art li:before{content:"";position:absolute;left:4px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--pri2)}
.week{display:flex;gap:12px;align-items:flex-start}
.week .wn{width:52px;height:52px;border-radius:16px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;color:var(--prid)}
.week .wn b{font-size:20px;font-weight:900;line-height:1}
.week .wn small{font-size:10.5px;font-weight:800}
.alr{padding:12px 0;border-bottom:1px solid var(--line)}
.alr:last-child{border-bottom:0}
.alr b{display:flex;align-items:center;gap:8px;color:#A32B2B;font-size:15.5px}
.alr p{margin:3px 0 0;font-size:14.5px;color:var(--ink2)}

/* mamãe */
.moods{display:flex;justify-content:space-between;gap:6px;margin-top:12px}
.mood{flex:1;padding:10px 0 8px;border-radius:15px;background:var(--soft2);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--ink2)}
.mood span{font-size:27px;line-height:1}
.mood.on{background:var(--soft);outline:2px solid var(--pri);color:var(--prid)}
.care{background:#FFF6EC;border:1.5px solid #F7D3A8}
.quote{font-size:17px;font-weight:800;line-height:1.4;color:var(--prid)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 18px}
.badge{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--sh);opacity:.5;filter:grayscale(1)}
.badge.on{opacity:1;filter:none}
.badge .bi{width:42px;height:42px;margin:0 auto 6px;border-radius:50%;background:linear-gradient(160deg,#FFE3A3,#F2B94A);display:grid;place-items:center;font-size:20px;color:#7A4A00}
.badge b{display:block;font-size:12.5px;font-weight:900;line-height:1.2}
.badge small{font-size:11px;color:var(--ink2);line-height:1.2;display:block;margin-top:2px}
.list{margin:0 18px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .lic{width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-size:18px;flex:none}
.li b{display:block;font-size:15.5px}
.li small{color:var(--ink2);font-size:13px}
.li .chev{margin-left:auto;color:var(--ink3);font-size:18px}
.addapp{display:flex;align-items:center;gap:12px;margin:12px 18px;padding:13px 14px;border-radius:var(--r);background:var(--card);box-shadow:var(--sh);width:calc(100% - 36px);text-align:left;border:1.5px dashed #CBBDF3}
.addapp b{display:block;font-size:15px}
.addapp small{color:var(--ink2);font-size:13px}
.addapp .go{margin-left:auto;background:var(--pri);color:#fff;font-weight:900;font-size:13px;padding:8px 12px;border-radius:999px;flex:none}

/* comprar */
.bhero{margin:12px 18px;border-radius:24px;padding:16px;background:linear-gradient(160deg,#2B1A6B,#4B2FA8);color:#fff;box-shadow:var(--sh2)}
.bprod{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.bprod:last-child{border-bottom:0}
.bprod b{display:block;font-size:15.5px}
.bprod small{opacity:.85;font-size:13px}
.bprod .bar{background:rgba(255,255,255,.16)}
.bprod .bar i{background:linear-gradient(90deg,#FFE3A3,#F2B94A)}
.bprod.urg .bar i{background:linear-gradient(90deg,#FFB27A,#F07A3A)}
.bmsg{margin-top:10px;background:rgba(255,255,255,.12);border-radius:14px;padding:11px 12px;font-size:14px}
.bmsg.urg{background:#F07A3A;font-weight:800}
.kit{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px;margin:12px 18px;position:relative;border:2px solid transparent}
.kit.best{border-color:var(--pri)}
.kit .flag{position:absolute;top:-11px;left:16px;background:var(--pri);color:#fff;font-size:11.5px;font-weight:900;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px}
.kit .flag.mine{background:var(--ok)}
.kit-top{display:flex;gap:14px;align-items:center}
.kit-pics{display:flex;align-items:flex-end;gap:2px;flex:none}
.kit-tx b{display:block;font-size:17px;font-weight:900}
.kit-tx small{color:var(--ink2);font-size:13px;display:block}
.kit-price{display:flex;align-items:flex-end;justify-content:space-between;margin:12px 0}
.kit-price s{color:var(--ink3);font-size:13.5px;display:block}
.kit-price .pp b{font-size:20px;font-weight:900;display:block;line-height:1.15}
.kit-price .pp small{color:var(--ink2);font-size:13px}
.eco{background:var(--okb);color:var(--ok);font-weight:900;font-size:12.5px;padding:5px 9px;border-radius:999px}
.coupon{display:flex;gap:12px;align-items:center;margin:12px 18px;padding:14px;border-radius:var(--r);border:2px dashed #CBBDF3;background:#FBF9FF}
.coupon b{font-size:19px;font-weight:900;letter-spacing:1px;color:var(--prid)}
.coupon small{display:block;color:var(--ink2);font-size:12.5px;font-weight:800}
.trust{margin:16px 18px;color:var(--ink2);font-size:12.5px;text-align:center;line-height:1.5}

/* navegação */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(var(--navh) + var(--safe));padding-bottom:var(--safe);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--ink3)}
.nav button .ic{font-size:23px}
.nav button.on{color:var(--pri)}
.nav .mid .mb{width:54px;height:54px;border-radius:19px;margin-top:-26px;background:linear-gradient(160deg,#7C5CD9,#3F2793);color:var(--gold);display:grid;place-items:center;box-shadow:0 8px 22px rgba(70,40,170,.45);border:4px solid var(--bg)}
.nav .mid .mb .ic{font-size:25px}

/* folha (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(20,12,45,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:480px;max-height:calc(92vh - var(--top));max-height:calc(92dvh - var(--top));overscroll-behavior:contain;-webkit-overflow-scrolling:touch;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;z-index:61;padding:10px 0 calc(22px + var(--safe));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{display:block;width:44px;height:5px;border-radius:9px;background:#D5CDEA;margin:0 auto 8px}
.sheet .close{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:18px;box-shadow:var(--sh);color:var(--ink2)}
.sh-h{padding:8px 60px 4px 18px}
.sh-h h2{font-size:22px;font-weight:900}

const parseISO=s=>{const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d);};

const addDays=(s,n)=>{const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d);};
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/DAY);
const hm=t=>{const d=new Date(t); return pad2(d.getHours())+":"+pad2(d.getMinutes());};

const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":"+pad2(m):m)+":"+pad2(x);};

function ageDays(){ return S.nasc?Math.max(0,daysBetween(S.nasc,today())):0; }

function ageTxt(){ const d=ageDays(); if(!S.nasc) return ""; if(d<7) return d===0?"nasceu hoje":plural(d,"dia");
  const w=Math.floor(d/7), r=d%7; if(w<13) return plural(w,"semana")+(r?" e "+plural(r,"dia"):"");
  const n=parseISO(S.nasc), t=new Date(); let m=(t.getFullYear()-n.getFullYear())*12+t.getMonth()-n.getMonth(); if(t.getDate()<n.getDate()) m--;
  const ref=new Date(n); ref.setMonth(n.getMonth()+m); const ex=Math.floor((t-ref)/DAY/7);
  return m>=24?plural(Math.floor(m/12),"ano"):plural(m,"mês","meses")+(ex?" e "+plural(ex,"semana"):""); }
function janela(){ const w=ageWeeks(); return JANELAS.find(j=>w<j.ate)||JANELAS[JANELAS.length-1]; }

function estoque(id){ const p=P[id], s=S.prods[id]; if(!p||!s||!s.frascos) return null;
  const total=s.frascos*p.aplicacoes, ini=s.inicio||today(), dd=daysBetween(ini,today());
  const el=dd<0?0:dd+1, logged=usosDe(id,parseISO(ini).getTime());
  const used=Math.min(total,Math.max(logged,el*p.porDia)), rem=total-used;
  const remDays=Math.ceil(rem/p.porDia), fim=addDays(today(),Math.max(0,remDays-1)), pedir=addDays(fim,-PRAZO_ENTREGA);
  return {p,total,used,rem,remDays,fim,pedir,pct:Math.round(used/total*100),urg:remDays<=PRAZO_ENTREGA,acabou:rem<=0,frascos:s.frascos,
          frascosRest:Math.max(0,Math.ceil(rem/p.aplicacoes)),futuro:dd<0}; }

/* ===== sons gerados no próprio celular (não precisa de arquivos de áudio) ===== */
const SR=22050;
function rngSeed(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function white(n,r){ const x=new Float32Array(n); for(let i=0;i<n;i++) x[i]=r()*2-1; return x; }
function lp(x,fc,passes=2){ const a=Math.exp(-2*Math.PI*fc/SR), b=1-a; for(let p=0;p<passes;p++){ let y=0; for(let i=0;i<x.length;i++){ y=b*x[i]+a*y; x[i]=y; } } return x; }
function hp(x,fc){ const l=lp(Float32Array.from(x),fc); for(let i=0;i<x.length;i++) x[i]-=l[i]; return x; }
function pink(n,r){ const x=new Float32Array(n); let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<n;i++){ const w=r()*2-1; b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; x[i]=b0+b1+b2+b3+b4+b5+b6+w*.5362; b6=w*.115926; } return x; }
function brown(n,r){ const x=new Float32Array(n); let l=0; for(let i=0;i<n;i++){ l=(l+.02*(r()*2-1))/1.02; x[i]=l; } return x; }
function norm(x,peak){ let m=0; for(let i=0;i<x.length;i++){ const v=Math.abs(x[i]); if(v>m) m=v; } const k=m?peak/m:1; for(let i=0;i<x.length;i++) x[i]*=k; return x; }
function loopify(x,fade=1.5){ const n=Math.floor(fade*SR), L=x.length-n, o=x.slice(0,L); for(let i=0;i<n;i++){ const w=i/n; o[i]=x[i]*w+x[L+i]*(1-w); } return o; }
function toWav(x){ const n=x.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf), s=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  s(0,"RIFF"); v.setUint32(4,36+n*2,true); s(8,"WAVE"); s(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,SR,true); v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); s(36,"data"); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ const c=Math.max(-1,Math.min(1,x[i])); v.setInt16(44+i*2,c*32767,true); } return new Blob([buf],{type:"audio/wav"}); }

/* ambientes */
function somAmbiente(id){ const r=rngSeed(7), D=32, N=D*SR;
  if(id==="ruido-branco") return norm(loopify(lp(white(N,r),6000)),.5);
  if(id==="ventilador") return norm(loopify(lp(pink(N,r),2500)),.55);
  if(id==="utero"){ const x=norm(lp(brown(N,r),420),.45), hb=new Float32Array(N), per=60/68;
    const thump=(at,amp)=>{ const i0=Math.floor(at*SR), L=Math.floor(.18*SR); for(let k=0;k<L&&i0+k<N;k++){ const t=k/SR; hb[i0+k]+=Math.sin(2*Math.PI*55*t)*Math.exp(-t*28)*(1-Math.exp(-t*400))*amp; } };
    for(let t=0;t<D-1;t+=per){ thump(t,.55); thump(t+.28,.35); } lp(hb,200); for(let i=0;i<N;i++) x[i]+=hb[i]*1.4; return norm(loopify(x),.6); }
  if(id==="chuva"){ const base=norm(hp(lp(pink(N,r),5000),300),.35), dr=new Float32Array(N);
    for(let k=0;k<D*45;k++){ const i0=Math.floor(r()*(N-1600)), L=300+Math.floor(r()*1000), a=.05+r()*.25; for(let j=0;j<L;j++) dr[i0+j]+=(r()*2-1)*Math.exp(-j/(L/5))*a; }
    hp(lp(dr,4500),800); for(let i=0;i<N;i++) base[i]=(base[i]+dr[i])*(1+.15*Math.sin(2*Math.PI*i/SR/9)); return norm(loopify(base),.55); }
  if(id==="shhh"){ const x=hp(lp(white(N,r),6500),1800), env=new Float32Array(N);
    for(let i=0;i<N;i++){ const ph=(i/SR%1.6)/1.6; env[i]=(ph<.75?Math.pow(Math.sin(Math.PI*ph/.75),.6):0)*.85+.15; } lp(env,30);
    for(let i=0;i<N;i++) x[i]*=env[i]; return norm(loopify(x),.5); }
  return null; }

/* canções (caixinha de música) */
const NOTA={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const midi=s=>{ let i=1, acc=0; if(s[1]==="b"){acc=-1;i=2;} else if(s[1]==="#"){acc=1;i=2;} return 12*(+s.slice(i)+1)+NOTA[s[0]]+acc; };
const hz=n=>440*Math.pow(2,(n-69)/12);
function addOsc(out,i0,f,dur,amp,parts){ const L=Math.min(out.length-i0,Math.floor(dur*SR));
  for(const [mul,a,dec] of parts){ const w=2*Math.PI*f*mul/SR; if(w>=Math.PI) continue; const c=2*Math.cos(w); let s1=0,s2=-Math.sin(w);
    for(let k=0;k<L;k++){ const s=c*s1-s2; s2=s1; s1=s; const t=k/SR; out[i0+k]+=s*a*amp*Math.exp(-t*dec)*(1-Math.exp(-t*600)); } } }
function addPad(out,i0,freqs,dur,amp){ const L=Math.min(out.length-i0,Math.floor(dur*SR));
  for(const f of freqs){ const w=2*Math.PI*f/SR; for(let k=0;k<L;k++){ const t=k/SR, e=Math.min(1,t/.8)*Math.min(1,(dur-t)/.8); out[i0+k]+=(Math.sin(w*k)+.2*Math.sin(2*w*k))*e*amp; } } }
function reverb(x){ const comb=[1116,1188,1277,1356].map(d=>Math.floor(d*SR/44100)), ap=[225,556].map(d=>Math.floor(d*SR/44100)), wet=new Float32Array(x.length);
  for(const d of comb){ const b=new Float32Array(d); let p=0,f=0; for(let i=0;i<x.length;i++){ const y=b[p]; f=y*.8+f*.2; b[p]=x[i]+f*.82; p=(p+1)%d; wet[i]+=y*.25; } }
  for(const d of ap){ const b=new Float32Array(d); let p=0; for(let i=0;i<x.length;i++){ const bo=b[p], y=-wet[i]+bo; b[p]=wet[i]+bo*.5; p=(p+1)%d; wet[i]=y; } }

function renderSong(seq,bpm,chords,reps,gap){ const beat=60/bpm, tot=seq.reduce((s,n)=>s+n[1],0)*beat*reps+gap*reps+4, out=new Float32Array(Math.floor(tot*SR)); let pos=0;

    if(chords){ let cp=st; for(const [ch,d] of chords){ addPad(out,Math.floor(cp*SR),ch.map(c=>hz(midi(c))),d*beat,.05); cp+=d*beat; } }

  reverb(out); const fd=3*SR; for(let i=0;i<fd;i++) out[out.length-fd+i]*=1-i/fd; return norm(out,.6); }

function bars(vals,labels,color,fmt){ const W=320,H=150,pb=22,pt=18,bw=26,gap=(W-bw*vals.length)/(vals.length+1),mx=Math.max(...vals,1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${vals.map((v,i)=>{ const x=gap+i*(bw+gap), h=Math.max(v?4:2,(H-pb-pt)*v/mx), y=H-pb-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="7" fill="${color}" opacity="${i===vals.length-1?1:.55}"/>${v?`<text class="v" x="${x+bw/2}" y="${y-5}" text-anchor="middle">${fmt(v)}</text>`:""}<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`; }).join("")}</svg>`; }

function diarioSemana(){ const days=[...Array(7)].map((_,i)=>addDays(today(),i-6)), lb=days.map((d,i)=>i===6?"hoje":DIAS[parseISO(d).getDay()]);
  const sono=days.map(d=>sonoDia(d)/3600e3), mam=days.map(d=>evDia(d,"mamada").length), col=days.map(d=>colicaDia(d)/MIN), fr=days.map(d=>evDia(d,"fralda").length);
  const cur=[...Array(7)].map((_,i)=>addDays(today(),i-7)), prev=[...Array(7)].map((_,i)=>addDays(today(),i-14)), avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const s1=avg(cur.map(d=>sonoDia(d)/3600e3)), s0=avg(prev.map(d=>sonoDia(d)/3600e3)), c1=avg(cur.map(d=>colicaDia(d)/MIN)), c0=avg(prev.map(d=>colicaDia(d)/MIN));
  const rit=days.filter(ritualOk).length;
  const ins=[]; if(s0>0&&s1>0){ const df=s1-s0; ins.push(Math.abs(df)<.25?"O sono ficou estável em relação à semana passada.":df>0?`${esc(bebe())} dormiu em média <b>${dur(df*3600e3)} a mais</b> por dia que na semana passada.`:`O sono caiu ${dur(-df*3600e3)} por dia. Fases assim são comuns: mantenha o ritual.`); }
  if(c0>0){ ins.push(c1<c0?`As cólicas diminuíram: de ${Math.round(c0)} para <b>${Math.round(c1)} min</b> por dia em média.`:c1>c0?`As cólicas aumentaram esta semana. A massagem guiada ajuda, e se vier com outros sinais, fale com o pediatra.`:""); }
  return `<div class="card" style="background:linear-gradient(135deg,#6B4ECF,#3F2793);color:#fff"><div class="row"><span style="font-size:26px;color:var(--gold)">${ic("moon")}</span><div class="grow"><b style="font-size:17px">${rit} de 7 noites com ritual completo</b><div style="opacity:.85;font-size:14px">${ins.filter(Boolean).join(" ")||"Continue registrando para ver a evolução semana a semana."}</div></div></div></div>
  <div class="card"><b>Sono por dia</b><div class="muted small">média de ${dur(s1*3600e3)} nos últimos 7 dias completos</div>${bars(sono,lb,"#7B5CD6",v=>v>=1?Math.round(v)+"h":Math.round(v*60)+"m")}</div>
  <div class="card"><b>Mamadas por dia</b>${bars(mam,lb,"#D9668F",v=>v)}</div>
  <div class="card"><b>Cólica (minutos por dia)</b>${bars(col,lb,"#E3A91F",v=>Math.round(v))}</div>
  <div class="card"><b>Fraldas por dia</b>${bars(fr,lb,"#2A87B8",v=>v)}</div>
  <div style="margin:0 18px"><button class="cta ghost press" data-sheet="relatorio">${ic("share")} Resumo para o pediatra</button></div>`; }

function diario(){ return `${topbar()}<div class="ptop"><div><h1>Diário</h1><p>Mamadas, sono, fraldas e cólicas de ${esc(bebe())}.</p></div></div>
  <div class="seg"><button class="${dseg==="hoje"?"on":""}" data-dseg="hoje">Hoje</button><button class="${dseg==="semana"?"on":""}" data-dseg="semana">Semana</button></div>
  ${dseg==="hoje"?diarioHoje():diarioSemana()}`; }

    </div>

  return `<div class="ob">${top}<div class="ob-body">${b}</div></div>`; }

function obSaveInputs(){ const g=id=>$("#"+id); if(g("ob-mae")) OB.mae=g("ob-mae").value; if(g("ob-bebe")) OB.bebe=g("ob-bebe").value; if(g("ob-nasc")) OB.nasc=g("ob-nasc").value; if(g("ob-ini")) OB.iniData=g("ob-ini").value||today(); if(g("ob-hora")&&g("ob-hora").value) OB.hora=g("ob-hora").value; }
function obCommit(){ const o=OB, ini=o.ini==="hoje"?today():o.ini==="ontem"?addDays(today(),-1):(o.iniData||today());
  S.mae=o.mae.trim(); S.bebe=o.bebe.trim(); S.nasc=o.nasc; S.dores=o.dores; S.hora=o.hora;
  PRODUTOS.forEach(p=>{ const n=o.prods[p.id]; if(n>0) S.prods[p.id]={frascos:n,inicio:S.prods[p.id]?.inicio||ini}; else delete S.prods[p.id]; });
  save(); }
function obNext(){ obSaveInputs(); if(!obValid()) return; if(OB.step===5){ obCommit(); OB._age=ageTxt(); OB.step=6; render(); runBuild(); track("onboarding_build"); return; } OB.step++; render(); focusOb(); if(OB.step===1) track("onboarding_start"); }
function focusOb(){ setTimeout(()=>{ const i=$(".ob input[type=text]"); if(i&&!i.value) i.focus(); },250); }
function runBuild(){ const L=$$("[data-bi]"); L.forEach((el,i)=>setTimeout(()=>el.classList.add("on"),350+i*420)); setTimeout(()=>{ OB.step=7; render(); },350+L.length*420+500); }
function obFinish(){ S.onb=true; save(); OB=null; tab="hoje"; render(true); scrollTo(0,0); track("onboarding_complete",{produtos:owned().map(p=>p.id).join(","),dores:S.dores.join(",")}); syncTags(); setTimeout(maybeAskInstall,900); }

/* ---------- diário: ações ---------- */
function addEv(e){ e.id=uid(); S.ev.push(e); if(S.ev.length>4000) S.ev=S.ev.slice(-4000); save(); return e; }
function startMamada(lado){ const a=S.ativo; if(a.mamada) stopMamada(true); a.mamada={t0:Date.now(),lado}; save(); vib(20); toast("Mamada iniciada"); render(true); track("log_mamada"); }
function stopMamada(silent){ const a=S.ativo.mamada; if(!a) return; addEv({k:"mamada",t0:a.t0,t1:Date.now(),lado:a.lado}); delete S.ativo.mamada; save(); if(!silent){ toast("Mamada de "+dur(Date.now()-a.t0)+" registrada"); render(true); } }
function trocarLado(){ const a=S.ativo.mamada; if(!a||a.lado==="M") return; const novo=a.lado==="E"?"D":"E"; stopMamada(true); S.ativo.mamada={t0:Date.now(),lado:novo}; save(); toast("Agora o lado "+(novo==="E"?"esquerdo":"direito")); render(true); }
function toggleSono(){ const a=S.ativo; if(a.sono){ addEv({k:"sono",t0:a.sono.t0,t1:Date.now()}); const d=Date.now()-a.sono.t0; delete a.sono; save(); toast(`${esc(primeiro(bebe()))} dormiu ${dur(d)}`); }
  else{ a.sono={t0:Date.now()}; save(); toast("Bons sonhos 🌙"); track("log_sono"); } vib(20); render(true); renderNight(); }
function toggleColica(){ const a=S.ativo; if(a.colica){ addEv({k:"colica",t0:a.colica.t0,t1:Date.now()}); const d=Date.now()-a.colica.t0; delete a.colica; save(); toast("Registrado: "+dur(d)+" de desconforto"); }
  else{ a.colica={t0:Date.now()}; save(); toast("Cronômetro iniciado"); track("log_colica");
    if(!tem("colic")&&P.colic) setTimeout(()=>openSheet(`<div class="sh-h"><h2>Cólica agora?</h2><p>Enquanto o cronômetro corre, tente isto:</p></div><div class="sh-b"><div class="art"><ul><li>Massagem I Love You (guiada no app)</li><li>Bicicletinha e joelhos na barriga</li><li>Colo de tigre e balanço suave</li></ul></div><button class="cta press" style="margin-top:14px" data-go="massagem:colica">${ic("hands")} Fazer a massagem guiada</button></div>${upsCard("colic")}`),600); }

function toggleRit(id){ const k=nightKey(); const d=S.ritual[k]=S.ritual[k]||[]; const was=ritualOk(k);

  if(!was&&ritualOk(k)){ S.maxSeq=Math.max(S.maxSeq||0,noitesSeguidas()); toast("Ritual completo. Boa noite! 🌙"); vib([30,60,30]); track("ritual_completo",{noites:noitesSeguidas()}); }

/* ---------- sons ---------- */
const AU=new Audio(); AU.loop=true; AU.preload="none";
const PL={id:null,playing:false,until:0};
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function playSom(id){ if(PL.id===id&&PL.playing){ stopSom(); return; }
  const s=SONS.find(x=>x.id===id); if(!s) return;
  PL.id=id; PL.playing=true; PL.until=S.som.timer?Date.now()+S.som.timer*MIN:0; AU.volume=S.som.vol; AU.loop=true;
  const fail=()=>{ PL.playing=false; PL.loading=false; toast("Toque de novo para tocar o som"); updatePlayer(); refreshSons(); renderNight(); };
  const start=url=>{ if(AU.src!==url) AU.src=url; try{ AU.currentTime=0; }catch(e){} const pr=AU.play(); if(pr) pr.catch(fail); };
  if(SOM_URL[id]) start(SOM_URL[id]);
  else { /* libera o áudio no toque (iPhone) e gera o som em seguida */
    AU.src=SILENCIO; const pr=AU.play(); if(pr) pr.catch(()=>{}); PL.loading=true; toast("Preparando o som…");
    setTimeout(()=>{ let url=null; try{ url=somURL(id); }catch(e){} PL.loading=false;
      if(!url) return fail(); if(PL.id===id&&PL.playing) start(url); updatePlayer(); },60); }
  if("mediaSession" in navigator){ try{ navigator.mediaSession.metadata=new MediaMetadata({title:s.nome,artist:APP_NAME,artwork:[{src:ICON512,sizes:"512x512",type:"image/png"}]}); navigator.mediaSession.setActionHandler("pause",stopSom); navigator.mediaSession.setActionHandler("stop",stopSom); }catch(e){} }
  track("som_play",{som:id}); refreshSons(); updatePlayer(); renderNight(); }
function stopSom(){ AU.pause(); PL.playing=false; PL.until=0; AU.volume=S.som.vol; refreshSons(); updatePlayer(); renderNight(); }
function refreshSons(){ if(S.onb&&tab==="acalmar") render(true); }
function updatePlayer(){ const el=$("#player"), on=PL.playing&&S.onb; document.body.classList.toggle("hasPlayer",on); if(!on){ el.classList.add("hide"); return; }
  const s=SONS.find(x=>x.id===PL.id); el.classList.remove("hide");
  el.innerHTML=`<span class="pi">${ic(s.ic)}</span><div class="grow"><b>${esc(s.nome)}</b><small data-pltime>${PL.loading?"preparando…":PL.until?"desliga em "+clock(PL.until-Date.now()):"tocando sem parar"}</small></div><button class="pb press" data-tab="acalmar" aria-label="Opções">${ic("sliders")}</button><button class="pb press" data-stopsom aria-label="Parar">${ic("stop")}</button>`;
  el.style.bottom=(tab==="comprar"||!S.onb)?"calc(env(safe-area-inset-bottom,0px) + 12px)":""; }
function setTimer(t){ S.som.timer=t; save(); if(PL.playing) PL.until=t?Date.now()+t*MIN:0; render(true); toast(t?`O som desliga em ${t} min`:"O som vai tocar sem parar"); }

/* ---------- modo noite ---------- */
const NM={on:false,red:false}; let wake=null;
async function lockWake(){ try{ if("wakeLock" in navigator) wake=await navigator.wakeLock.request("screen"); }catch(e){} }
function openNight(fromRit){ NM.on=true; lockWake(); renderNight(); track("modo_noite"); if(fromRit) markRit("mamada"); }
function closeNight(){ NM.on=false; try{ wake&&wake.release(); }catch(e){} wake=null; $("#night").innerHTML=""; render(true); }
function renderNight(){ const n=$("#night"); if(!NM.on){ n.innerHTML=""; return; } const a=S.ativo, now=new Date();
  const somOn=PL.playing, tm=S.som.timer;
  n.innerHTML=`<div class="nightm ${NM.red?"red":""}">
   <div class="clock" data-nclock>${pad2(now.getHours())}:${pad2(now.getMinutes())}</div>
   <div class="nsub">${a.sono?`${esc(primeiro(bebe()))} dormindo há <span data-since-dur="${a.sono.t0}">${dur(Date.now()-a.sono.t0)}</span>`:a.mamada?"Mamada em andamento":"Modo Noite"}</div>
   ${a.mamada?`<div class="ntimer" data-since="${a.mamada.t0}">${clock(Date.now()-a.mamada.t0)}</div><div class="nsub">Lado ${a.mamada.lado==="E"?"esquerdo":a.mamada.lado==="D"?"direito":"mamadeira"}</div>`:""}
   <div class="nfoot">
    <div class="nrow">${a.mamada?`${a.mamada.lado!=="M"?`<button class="nb press" data-n="trocar"><span>${ic("wave")}</span><span>Trocar lado</span></button>`:""}<button class="nb press" data-n="mam-stop"><span>${ic("check")}</span><span>Terminar mamada</span></button>`
      :`<button class="nb press" data-n="mamE"><span>${ic("bottle")}</span><span>Mamada E</span></button><button class="nb press" data-n="mamD"><span>${ic("bottle")}</span><span>Mamada D</span></button>`}</div>
    <div class="nrow"><button class="nb press ${somOn?"on":""}" data-n="som"><span>${ic("wave")}</span><span>${somOn?esc(SONS.find(s=>s.id===PL.id).nome):"Ruído branco"}</span></button>
     <button class="nb press" data-n="timer"><span>${ic("clock")}</span><span data-ntimer>${somOn&&PL.until?clock(PL.until-Date.now()):tm?tm+" min":"Sem timer"}</span></button>
     <button class="nb press ${a.sono?"on":""}" data-n="sono"><span>${ic("moon")}</span><span>${a.sono?"Acordou":"Dormiu"}</span></button></div>
    <div class="nrow"><button class="nb press ${NM.red?"on":""}" data-n="red"><span>${ic("lamp")}</span><span>Luz vermelha</span></button><button class="nb press" data-n="sair"><span>${ic("x")}</span><span>Sair</span></button></div>
   </div></div>`; }
function nightAct(k){ if(k==="sair") return closeNight(); if(k==="red"){ NM.red=!NM.red; return renderNight(); }
  if(k==="mamE"||k==="mamD"){ startMamada(k==="mamE"?"E":"D"); return renderNight(); }
  if(k==="mam-stop"){ stopMamada(); return renderNight(); } if(k==="trocar"){ trocarLado(); return renderNight(); }
  if(k==="som"){ PL.playing?stopSom():playSom(PL.id||"ruido-branco"); return; }
  if(k==="timer"){ const o=[15,30,60,0], i=(o.indexOf(S.som.timer)+1)%o.length; S.som.timer=o[i]; save(); if(PL.playing) PL.until=o[i]?Date.now()+o[i]*MIN:0; return renderNight(); }
  if(k==="sono"){ toggleSono(); } }

const RESPIRAR={id:"respirar",titulo:"Respirar 2 minutos",sub:"Pausa guiada",para:"mae",antes:"Sente-se confortável e solte os ombros.",passos:[{t:"Respire comigo",d:"Inspire pelo nariz enquanto o círculo cresce. Solte devagar pela boca enquanto ele diminui.",s:120,respira:true}]};
let MG=null;
function openMass(id,fromRit){ const m=id==="respirar"?RESPIRAR:MASSAGENS.find(x=>x.id===id); if(!m) return; closeSheet();
  MG={m,i:-1,left:0,paused:false,ended:false,fromRit,el:0}; lockWake(); renderMG(); track("massagem_inicio",{massagem:id}); }
function closeMG(){ MG=null; $("#mg").innerHTML=""; if(!NM.on){ try{ wake&&wake.release(); }catch(e){} } render(true); }
function mgGo(i){ const L=MG.m.passos.length; if(i>=L){ MG.ended=true; vib([40,80,40]); onMassEnd(); return renderMG(); } MG.i=Math.max(0,i); MG.left=MG.m.passos[MG.i].s; MG.el=0; MG.paused=false; vib(60); renderMG(); }
function onMassEnd(){ const m=MG.m; if(m.id==="respirar"){ S.resp=(S.resp||[]).concat(today()).slice(-60); }
  S.massagens=(S.massagens||0)+1; if(MG.fromRit) markRit("massagem"); save(); track("massagem_fim",{massagem:m.id}); }
function renderMG(){ const box=$("#mg"); if(!MG){ box.innerHTML=""; return; } const m=MG.m, L=m.passos.length;
  const dots=`<div class="mg-dots">${m.passos.map((_,i)=>`<i class="${i<=MG.i||MG.ended?"on":""}"></i>`).join("")}</div>`;
  let c="";
  if(MG.i<0&&!MG.ended){ const p=P[m.produto], secs=m.passos.reduce((s,x)=>s+x.s,0);
    c=`<div class="mg-c">${p?bottle(p.id,96):`<span style="font-size:56px;color:var(--gold)">${ic("heart")}</span>`}<small style="margin-top:18px">${Math.round(secs/60)} minutos · ${L} passo${L>1?"s":""}</small><h2>${esc(T(m.titulo))}</h2><p>${esc(T(m.antes||""))}</p>
      ${p&&!tem(p.id)?`<p style="margin-top:14px;font-size:14.5px;opacity:.8">Sem o ${esc(p.nome)}? Dá para fazer só a massagem.</p>`:""}</div>
      <button class="cta green press" data-mg="start">${ic("play")} Começar</button>`; }
  else if(MG.ended){ const p=P[m.produto];
    c=`<div class="mg-c mg-end"><span style="font-size:64px;color:var(--gold)">${ic("star")}</span><h2>Pronto!</h2><p>${m.para==="mae"?"Que bom que você tirou esse tempo para você.":"Agora, luz baixa e colo. Bom descanso para vocês."}</p></div>
      ${p?(tem(p.id)?`<button class="cta green press" data-mg="aplic">${ic("check")} Registrar aplicação do ${esc(p.nome)}</button><button class="cta ghost press" style="margin-top:10px;background:rgba(255,255,255,.12);color:#fff" data-mg="close">Não usei agora</button>`
        :`<div class="card" style="margin:0 0 12px;color:var(--ink)"><div class="row">${bottle(p.id,58)}<div class="grow"><b>Complete com o ${esc(p.nome)}</b><div class="muted small">${esc(p.desc)}</div></div></div></div><button class="cta green press" data-mg="buy">Conhecer o ${esc(p.nome)}</button><button class="cta ghost press" style="margin-top:10px;background:rgba(255,255,255,.12);color:#fff" data-mg="close">Fechar</button>`)
        :`<button class="cta green press" data-mg="close">Concluir</button>`}`; }
  else { const s=m.passos[MG.i], C=2*Math.PI*86, pr=1-MG.left/s.s;
    const vis=s.respira?`<div class="breath"><i data-br></i><b data-brt>Inspire</b></div>`:`<div class="mg-ring"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="86" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="8"/><circle data-ring cx="95" cy="95" r="86" fill="none" stroke="#FFE2A0" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pr)}"/></svg><b data-left>${clock(MG.left*1000)}</b></div>`;
    c=`<div class="mg-c"><small>Passo ${MG.i+1} de ${L}</small><h2>${esc(T(s.t))}</h2><p>${esc(T(s.d))}</p>${vis}</div>
    <div class="mg-ctr"><button class="press" data-mg="prev" aria-label="Voltar passo">${ic("prev")}</button><button class="main press" data-mg="pause" aria-label="${MG.paused?"Continuar":"Pausar"}">${ic(MG.paused?"play":"pause")}</button><button class="press" data-mg="next" aria-label="Próximo passo">${ic("next")}</button></div>`; }
  box.innerHTML=`<div class="mg"><div class="mg-top"><button class="x press" data-mg="close" aria-label="Fechar">${ic("x")}</button>${dots}</div>${c}</div>`; breathTick(); }
function breathTick(){ if(!MG||MG.ended||MG.i<0) return; const s=MG.m.passos[MG.i]; if(!s.respira) return;
  const ph=MG.el%10, el=$("[data-br]"), t=$("[data-brt]"); if(!el) return; const inh=ph<4;
  el.classList.toggle("in",inh); el.classList.toggle("out",!inh); t.textContent=MG.paused?"Pausado":inh?"Inspire":"Solte devagar"; }
function mgTick(){ if(!MG||MG.ended||MG.i<0||MG.paused) return; MG.left--; MG.el++;
  if(MG.left<=0) return mgGo(MG.i+1);
  const s=MG.m.passos[MG.i], C=2*Math.PI*86, r=$("[data-ring]"), l=$("[data-left]");
  if(r) r.setAttribute("stroke-dashoffset",C*(MG.left/s.s)); if(l) l.textContent=clock(MG.left*1000); breathTick(); }
function mgAct(k){ if(k==="close") return closeMG(); if(k==="start") return mgGo(0); if(k==="next") return mgGo(MG.i+1); if(k==="prev") return mgGo(Math.max(0,MG.i-1));
  if(k==="pause"){ MG.paused=!MG.paused; return renderMG(); }
  if(k==="aplic"){ aplicar(MG.m.produto,true); toast(`Aplicação do ${esc(P[MG.m.produto].nome)} registrada`); return closeMG(); }
  if(k==="buy"){ const id=MG.m.produto; closeMG(); buyOne(id); } }

let CK=null;
function weekStats(off){ const days=[...Array(7)].map((_,i)=>addDays(today(),i-7-off)), avg=a=>a.reduce((s,x)=>s+x,0)/7;
  return {sono:avg(days.map(sonoDia)),mam:avg(days.map(d=>evDia(d,"mamada").length)),col:avg(days.map(colicaDia)),rit:days.filter(ritualOk).length,apl:days.reduce((s,d)=>s+evDia(d,"aplic").length,0)}; }

function ckRender(){ const Q=[["noites","Como foram as noites nesta semana?",[["1","Muito difíceis"],["2","Difíceis"],["3","Normais"],["4","Boas"],["5","Ótimas"]]],
  ["colica","E as cólicas e o choro?",[["menos","Diminuíram"],["igual","Iguais"],["mais","Aumentaram"],["nao","Não teve"]]],
  ["mae","E você, como está?",MOODS.map(([e,l],i)=>[String(i+1),e+" "+l])]];
  if(CK.step>=Q.length){ const w=weekStats(0), r={d:today(),...CK.a,sono:w.sono,col:w.col,rit:w.rit,apl:w.apl}; S.checkins.push(r); save(); track("checkin"); render(true); return openSheet(sh("Sua semana",fmtDate(r.d),ckReport(r))); }
  const [k,t,o]=Q[CK.step]; openSheet(sh(t,`Check-in semanal · ${CK.step+1} de ${Q.length}`,`<div class="col" style="gap:8px;margin-top:6px">${o.map(([v,l])=>`<button class="opt press" style="background:#fff;color:var(--ink);border-color:var(--line)" data-ck="${k}" data-v="${v}">${esc(l)}</button>`).join("")}</div>`)); }
function ckReport(r){ const prev=S.checkins[S.checkins.indexOf(r)-1], w0=weekStats(7);
  const lines=[];
  lines.push(`<li><b>${r.rit} de 7</b> noites com ritual completo.</li>`);
  if(r.sono) lines.push(`<li>Sono médio registrado: <b>${dur(r.sono)}</b> por dia${w0.sono?` (semana anterior: ${dur(w0.sono)})`:""}.</li>`);
  if(r.col||w0.col) lines.push(`<li>Cólica: <b>${Math.round(r.col/MIN)} min</b> por dia${w0.col?` (antes: ${Math.round(w0.col/MIN)} min)`:""}.</li>`);
  if(r.apl) lines.push(`<li><b>${r.apl}</b> aplicações dos produtos registradas.</li>`);
  if(prev&&r.noites&&prev.noites) lines.push(`<li>Você avaliou as noites como <b>${r.noites>prev.noites?"melhores":r.noites<prev.noites?"mais difíceis":"iguais"}</b> à semana passada.</li>`);
  const next=r.noites<=2?"Para a próxima semana: tente o ritual completo todas as noites, no mesmo horário. A repetição é o que faz efeito."
    :r.colica==="mais"?"Para a próxima semana: massagem para cólica 30 a 45 min depois das mamadas da tarde, quando o choro costuma piorar."
    :"Para a próxima semana: mantenha o ritual e o mesmo som. Está funcionando.";
  const low=owned().map(p=>estoque(p.id)).filter(e=>e&&e.remDays<=14);
  return `<div class="art"><ul>${lines.join("")}</ul></div><div class="card" style="margin:14px 0 0;background:var(--soft)"><b>${esc(next)}</b></div>
  ${+r.mae<=2?`<div class="card care" style="margin:12px 0 0"><b>Cuide de você também</b><p class="muted small" style="margin:4px 0 0">Peça ajuda para dividir as noites e, se a tristeza continuar, converse com seu médico. CVV: <a class="link" href="tel:188">188</a>.</p></div>`:""}
  ${low.length?`<div class="card" style="margin:12px 0 0;border:1.5px solid #F6C58F;background:#FFF8EE"><b>${low.map(e=>esc(e.p.nome)).join(" e ")} ${low.length>1?"acabam":"acaba"} em breve</b><p class="muted small" style="margin:4px 0 10px">Para não interromper a rotina na próxima semana.</p><button class="cta sm press" data-tab="comprar" data-closeafter>Ver opções</button></div>`:""}`; }
function sheetRelatorio(){ const w=weekStats(0), days=[...Array(7)].map((_,i)=>addDays(today(),i-7)), fr=days.reduce((s,d)=>s+evDia(d,"fralda").filter(e=>e.tipo!=="coco").length,0)/7;
  const txt=`Resumo de ${S.bebe||"bebê"} (${ageTxt()}) – últimos 7 dias\n• Sono registrado: ${dur(w.sono)} por dia em média\n• Mamadas: ${w.mam.toFixed(1).replace(".",",")} por dia\n• Fraldas molhadas: ${fr.toFixed(1).replace(".",",")} por dia\n• Cólica/choro: ${Math.round(w.col/MIN)} min por dia\n(registrado no app ${APP_NAME})`;
  openSheet(sh("Resumo para o pediatra","Leve para a consulta ou envie por mensagem.",`<textarea class="inp" id="rel" readonly style="font-family:var(--f);font-size:15px;min-height:170px">${esc(txt)}</textarea><div class="btns"><button class="tb press" data-copy-from="rel">${ic("copy")} Copiar</button>${navigator.share?`<button class="tb on press" data-sharetxt="rel">${ic("share")} Enviar</button>`:""}</div>`)); }

/* ---------- instalar ---------- */
let deferredPrompt=null;
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; });
function isStandalone(){ return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true; }
function maybeAskInstall(){ if(isStandalone()||S.askedInstall) return; sheetInstalar(); }

/* ---------- métricas e lembretes ---------- */
function track(ev,params={}){ try{ if(GA4_ID&&window.gtag) gtag("event",ev,params); if(META_PIXEL_ID&&window.fbq){ if(ev==="buy_click") fbq("track","InitiateCheckout",{value:params.value,currency:"BRL",content_name:params.item}); else fbq("trackCustom",ev,params); } }catch(e){} }
function loadTrackers(){ if(GA4_ID){ const s=document.createElement("script"); s.async=true; s.src="https://www.googletagmanager.com/gtag/js?id="+GA4_ID; document.head.appendChild(s); window.dataLayer=window.dataLayer||[]; window.gtag=function(){dataLayer.push(arguments);}; gtag("js",new Date()); gtag("config",GA4_ID); }
  if(META_PIXEL_ID){ !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js"); fbq("init",META_PIXEL_ID); fbq("track","PageView"); }
  if(ONESIGNAL_APP_ID){ window.OneSignalDeferred=window.OneSignalDeferred||[]; const s=document.createElement("script"); s.defer=true; s.src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"; document.head.appendChild(s);
    OneSignalDeferred.push(async OS=>{ try{ await OS.init({appId:ONESIGNAL_APP_ID,allowLocalhostAsSecureOrigin:true}); syncTags(); }catch(e){} }); } }
function syncTags(){ if(!ONESIGNAL_APP_ID||!window.OneSignalDeferred) return; const es=owned().map(p=>estoque(p.id)).filter(Boolean);
  const tags={nome:primeiro(S.mae),bebe:primeiro(S.bebe),semanas:String(ageWeeks()),ritual_hora:S.hora,produtos:owned().map(p=>p.id).join(","),
    dias_restantes:String(es.length?Math.min(...es.map(e=>e.remDays)):-1),lemb_ritual:S.lemb.ritual?"1":"0",lemb_recompra:S.lemb.recompra?"1":"0",lemb_dicas:S.lemb.dicas?"1":"0"};
  OneSignalDeferred.push(async OS=>{ try{ OS.User.addTags(tags); }catch(e){} }); }
function enableNotif(){ if(!ONESIGNAL_APP_ID) return; OneSignalDeferred.push(async OS=>{ try{ await OS.Notifications.requestPermission(); S.notif=!!OS.Notifications.permission; save(); syncTags(); toast(S.notif?"Lembretes ativados":"Permissão não concedida"); }catch(e){ toast("Não foi possível ativar agora"); } }); closeSheet(); }

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{ const t=e.target.closest("button,a,[data-go]"); if(!t) return; const d=t.dataset;
  if(t.closest("#night")&&d.n) return nightAct(d.n);
  if(d.mg) return mgAct(d.mg);
  if("close" in d) return closeSheet();
  if(d.tab){ if(d.sub===undefined) sub=null; closeSheet(); if(d.tab===tab&&!sub){ scrollTo({top:0,behavior:"smooth"}); render(true); return; } return go(d.tab); }
  if(d.sub){ const to=d.tabto||(["semanas","metodo","alertas"].includes(d.sub)||d.sub.startsWith("g:")?"guias":tab); closeSheet(); return go(to,d.sub); }
  if("back" in d){ sub=null; return go(tab); }
  if(d.goto) return go(d.goto);
  if(d.go){ e.stopPropagation(); const [a,b]=d.go.split(":");
    if(a==="massagem") return openMass(b,!!t.closest("[data-rit]")||(b==="sono"&&tab==="hoje"));
    if(a==="respirar") return openMass("respirar"); if(a==="noite"){ closeSheet(); return openNight(!!t.closest("[data-rit]")); } if(a==="sons"){ markRit("som"); return go("acalmar"); } return; }
  if(d.rit) return toggleRit(d.rit);
  if(d.act){ const a=d.act; if("closeafter" in d) closeSheet();
    if(a==="sono") return toggleSono(); if(a==="colica") return toggleColica(); if(a==="q-mamada") return sheetMamada(); if(a==="q-fralda") return sheetFralda();
    if(a==="mam-stop") return stopMamada(); if(a==="trocar") return trocarLado(); if(a==="noite") return openNight();
    if(a==="acordou-ha") return openSheet(sh("Acordou há quanto tempo?","",`<div class="tchips">${[5,15,30,45,60,90].map(m=>`<button class="tchip press" data-acordou="${m}">${m} min</button>`).join("")}</div>`));
    if(a==="indicar"){ const url=withUtm(INDICACAO.url,"indicacao"), text=`Estou usando os produtos ${MARCA} no ritual da noite do meu bebê. Olha aqui:`+(INDICACAO.cupom?` (cupom ${INDICACAO.cupom})`:"");
      track("indicar"); if(navigator.share) navigator.share({title:MARCA,text,url}).catch(()=>{}); else copyTxt(text+" "+url); return; }
    if(a==="comprei") return sheetProdutos(); }
  if(d.acordou){ S.acordou=Date.now()-(+d.acordou)*MIN; save(); closeSheet(); toast("Anotado"); return render(true); }
  if(d.mam){ if("closeafter" in d) closeSheet(); return startMamada(d.mam); }
  if(d.fra) return fralda(d.fra);
  if(d.apl) return aplicar(d.apl);
  if(d.del) return sheetDel(d.del);
  if(d.delok){ S.ev=S.ev.filter(x=>x.id!==d.delok); save(); closeSheet(); toast("Registro apagado"); return render(true); }
  if(d.dseg){ dseg=d.dseg; return render(true); }
  if(d.sheet){ const m={add:sheetAdd,choro:sheetChoro,produtos:sheetProdutos,dados:sheetDados,backup:sheetBackup,apagar:sheetApagar,instalar:sheetInstalar,lembretes:sheetLembretes,checkin:()=>sheetCheckin(false),relatorio:sheetRelatorio}[d.sheet]; return m&&m(); }
  if(d.addk) return sheetAdd(d.addk);
  if(d.pick){ $$(".tchip",t.parentNode).forEach(x=>x.classList.toggle("on",x===t)); return; }
  if(d.addsave) return addSave(d.addsave);
  if(d.ps){ const s=$(`[data-psn="${d.ps}"]`); s.textContent=Math.max(0,Math.min(9,+s.textContent+(+d.d))); return; }
  if("prodsave" in d) return prodSave();
  if(d.ddor){ t.classList.toggle("on"); return; }
  if("dadossave" in d) return dadosSave();
  if(d.lemb){ S.lemb[d.lemb]=!S.lemb[d.lemb]; save(); return sheetLembretes(); }
  if("notif" in d) return enableNotif();
  if("restore" in d) return restore();
  if("wipe" in d){ try{ localStorage.removeItem(KEY); }catch(x){} stopSom(); load(); OB=null; tab="hoje"; closeSheet(); render(); return; }
  if("install" in d){ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; closeSheet(); }); } return; }
  if(d.copy) return copyTxt(d.copy);
  if(d.copyFrom) return copyTxt($("#"+d.copyFrom).value);
  if(d.sharetxt){ navigator.share({text:$("#"+d.sharetxt).value}).catch(()=>{}); return; }
  if(d.ck){ CK.a[d.ck]=d.v; CK.step++; return ckRender(); }
  if("ckforce" in d) return sheetCheckin(true);
  if(d.mood){ S.humor[today()]=+d.mood; save(); toast(+d.mood<=2?"Obrigada por contar. Pegue leve com você hoje 💜":"Anotado 💜"); return render(true); }
  if(d.timer!==undefined) return setTimer(+d.timer);
  if(d.som) return playSom(d.som);
  if("stopsom" in d) return stopSom();
  if(d.buyone) return buyOne(d.buyone);
  if(d.buy){ track("buy_click",{item:d.buy,value:+d.price}); return; }
  if(d.track) track(d.track);
  /* onboarding */
  if("obnext" in d) return obNext();
  if("obback" in d){ obSaveInputs(); OB.step=Math.max(0,OB.step-1); return render(); }
  if("obfinish" in d) return obFinish();
  if(d.pq){ obSaveInputs(); OB.prods[d.pq]=Math.max(0,Math.min(9,OB.prods[d.pq]+(+d.d))); return render(); }
  if(d.ini){ obSaveInputs(); OB.ini=d.ini; return render(); }
  if(d.dor){ const i=OB.dores.indexOf(d.dor); i>=0?OB.dores.splice(i,1):OB.dores.push(d.dor); return render(); }
  if(d.hora){ OB.hora=d.hora; return render(); }
});
document.addEventListener("input",e=>{ const t=e.target;
  if(t.matches("[data-vol]")){ S.som.vol=+t.value; AU.volume=S.som.vol; save(); }
  if(t.closest(".ob")){ obSaveInputs(); const b=$(".ob [data-obnext]"); if(b) b.disabled=!obValid(); if(t.id==="ob-hora"&&t.value){ $$(".optg .opt").forEach(x=>x.classList.toggle("on",x.dataset.hora===t.value)); } } });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.closest(".ob")&&e.target.matches("input")){ e.preventDefault(); obNext(); } if(e.key==="Escape"){ if(sheetOpen) closeSheet(); } });
$("#scrim").addEventListener("click",closeSheet);
function copyTxt(s){ (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast("Copiado")).catch(()=>{ const a=document.createElement("textarea"); a.value=s; document.body.appendChild(a); a.select(); try{ document.execCommand("copy"); toast("Copiado"); }catch(x){} a.remove(); }); }

/* ---------- relógio ---------- */
let lastMin=new Date().getMinutes();
setInterval(()=>{ const now=Date.now();
  $$("[data-since]").forEach(el=>el.textContent=clock(now-(+el.dataset.since)));
  $$("[data-since-dur]").forEach(el=>el.textContent=dur(now-(+el.dataset.sinceDur)));
  if(PL.playing&&PL.until){ const left=PL.until-now;
    if(left<=0) stopSom(); else { if(left<10000&&!isIOS) AU.volume=Math.max(0,S.som.vol*left/10000);
      const p=$("[data-pltime]"); if(p) p.textContent="desliga em "+clock(left); const n=$("[data-ntimer]"); if(n) n.textContent=clock(left); } }
  if(NM.on){ const c=$("[data-nclock]"), d=new Date(); if(c) c.textContent=pad2(d.getHours())+":"+pad2(d.getMinutes()); }
  mgTick();
  const m=new Date().getMinutes(); if(m!==lastMin){ lastMin=m; if(S.onb&&!sheetOpen&&!MG&&!NM.on&&tab==="hoje"&&!document.activeElement?.matches("input,textarea")) render(true); }
},1000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(NM.on||MG) lockWake(); if(S.onb&&!sheetOpen&&!MG) render(true); } });
AU.addEventListener("pause",()=>{ if(PL.playing&&!AU.ended&&document.visibilityState==="visible"&&AU.paused){ /* pausado pelo sistema */ } });

/* ---------- rotas (links de notificação) ---------- */
function route(){ const h=(location.hash||"").replace("#",""); if(!h||!S.onb) return;
  const map={hoje:["hoje"],diario:["diario"],acalmar:["acalmar"],guias:["guias"],mamae:["mamae"],comprar:["comprar"],semana:["guias","semanas"],alertas:["guias","alertas"]};
  if(map[h]){ go(map[h][0],map[h][1]||null); }
  else if(h==="noite") openNight(); else if(h.startsWith("massagem-")) openMass(h.slice(9)); else if(h==="checkin") sheetCheckin(false); else if(h==="respirar") openMass("respirar");
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
addEventListener("hashchange",route);

/* ---------- início ---------- */
load(); render(); loadTrackers(); route(); track("app_open",{standalone:isStandalone()?"1":"0"});
if(/^https?:/.test(location.protocol)) addEventListener("load",()=>{
  fetch("manifest.webmanifest",{method:"HEAD",cache:"no-store"}).then(r=>{ if(!r.ok) throw 0; }).catch(()=>{ const base=location.href.split("#")[0].split("?")[0];
    const m={name:APP_NAME,short_name:APP_NAME,lang:"pt-BR",start_url:base,scope:base.replace(/[^/]*$/,""),display:"standalone",background_color:"#22145A",theme_color:"#5536B9",icons:[{src:ICON192,sizes:"192x192",type:"image/png"},{src:ICON512,sizes:"512x512",type:"image/png"}]};
    const l=$('link[rel="manifest"]'); if(l) l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"})); });
  if("serviceWorker" in navigator&&!/^(localhost|127\.)/.test(location.hostname)) fetch("sw.js",{method:"HEAD",cache:"no-store"}).then(r=>{ if(r.ok) navigator.serviceWorker.register("sw.js").catch(()=>{}); }).catch(()=>{});
  setTimeout(()=>{ try{ somURL("ruido-branco"); }catch(e){} },2500);
});

</script>
